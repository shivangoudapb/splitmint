services:
  - type: web
    name: splitmint
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: npm start
    envVars:
      - key: TOKEN_SECRET
        generateValue: true
      - key: DATA_FILE
        value: /var/data/splitmint.json
    disk:
      name: splitmint-data
      mountPath: /var/data
      sizeGB: 1
